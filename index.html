:root {
  --bg: #070510;
  --bg-card: rgba(18, 14, 36, 0.7);
  --panel: #110d28;
  --line: rgba(168, 85, 247, 0.18);
  --line-hover: rgba(168, 85, 247, 0.5);
  --text: #f5f3ff;
  --muted: #948eb0;
  --accent: #a855f7;
  --accent-glow: rgba(168, 85, 247, 0.4);
  --cyan: #38bdf8;
  --green: #22c55e;
  --red: #ef4444;
  --gold: #f59e0b;
  --radius: 16px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* Background Effects */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background: 
    radial-gradient(circle at 15% 15%, rgba(147, 51, 234, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 85% 25%, rgba(56, 189, 248, 0.12) 0%, transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 45%);
}

.wrap { max-width: 1240px; margin: auto; padding: 0 20px; }

/* Header & Nav */
header {
  position: sticky;
  top: 0;
  background: rgba(7, 5, 16, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  z-index: 100;
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  gap: 15px;
}
.brand {
  font-weight: 900;
  font-size: 1.45rem;
  letter-spacing: -0.03em;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.brand i {
  color: var(--accent);
  filter: drop-shadow(0 0 10px var(--accent));
}
.brand span { color: var(--cyan); }

.navlinks { display: flex; gap: 10px; align-items: center; }

/* Buttons */
button, .btn {
  font-weight: 700;
  font-size: 0.88rem;
  border-radius: 12px;
  padding: 10px 18px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: var(--transition);
  text-decoration: none;
  color: #fff;
  background: linear-gradient(135deg, #9333ea, #a855f7);
  box-shadow: 0 4px 20px var(--accent-glow);
}
button:hover, .btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
  box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
}
button.secondary {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  border: 1px solid var(--line);
  box-shadow: none;
}
button.secondary:hover {
  background: rgba(168, 85, 247, 0.15);
  border-color: var(--accent);
}
button.danger { background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
button.success { background: linear-gradient(135deg, #16a34a, #22c55e); box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

/* Wallet & User Chip */
.account-group { display: flex; align-items: center; gap: 10px; }
.wallet-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
  font-size: 0.82rem;
}
.wallet-chip strong { color: #c4b5fd; font-size: 0.92rem; }

/* Hero Section */
.hero {
  text-align: center;
  padding: 70px 0 50px;
  max-width: 820px;
  margin: auto;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(168, 85, 247, 0.4);
  padding: 6px 16px;
  border-radius: 99px;
  color: #c084fc;
  background: rgba(147, 51, 234, 0.1);
  font-size: 0.82rem;
  font-weight: 700;
  margin-bottom: 20px;
}
.hero h1 {
  font-size: clamp(2.4rem, 5.5vw, 4rem);
  font-weight: 900;
  line-height: 1.15;
  letter-spacing: -0.04em;
  margin-bottom: 18px;
}
.hero h1 .gradient {
  background: linear-gradient(120deg, #c084fc, #a855f7, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p { color: var(--muted); font-size: 1.1rem; margin-bottom: 30px; }
.hero-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

/* Form Controls */
input, textarea, select {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--line);
  background: rgba(10, 7, 24, 0.8);
  color: var(--text);
  border-radius: 12px;
  outline: none;
  transition: var(--transition);
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
}
label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
